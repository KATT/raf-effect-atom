name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every commit on main gets its own full run, so a red commit is never hidden by
# the push after it. Pull requests only need their latest run.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

jobs:
  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm test

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm typecheck

  build_www:
    name: Build www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      # Compiled Twoslash blocks. Each entry checks the files it was compiled
      # from, so restoring an older cache only means more blocks recompile.
      - uses: actions/cache@v6
        with:
          key: twoslash-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          path: www/node_modules/.cache/twoslash
          restore-keys: |
            twoslash-${{ hashFiles('pnpm-lock.yaml') }}-
            twoslash-
      - run: pnpm build:www
