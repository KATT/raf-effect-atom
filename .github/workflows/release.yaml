# Run by hand from the Actions tab: publishing stays the maintainer's call
# until the packages exist on npm and trusted publishing is set up (see
# .github/DEVELOPMENT.md). To release on every push to main, add `push:
# branches: [main]` here; the gate and the stale-main check already handle it.
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (each one has its own version and tag)
        type: choice
        default: all
        options:
          - all
          - effect-atom-boundary
          - raf-effect-atom

concurrency:
  group: ${{ github.workflow }}

jobs:
  # Pick the packages with commits since their own latest tag, so a run with
  # nothing publishable skips install/build.
  gate:
    # release-it pushes "chore(release): <package>@x.y.z"; a push trigger would
    # otherwise re-run on it.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}"
    outputs:
      packages: ${{ steps.check.outputs.packages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - id: check
        # Tag pattern and path must match git.tagName and git.commitsPath in
        # release-it/<package>.json. Before a package's first tag, every
        # commit under it counts.
        env:
          SELECTED: ${{ inputs.package || 'all' }}
        run: |
          release=()
          for config in release-it/*.json; do
            pkg=$(basename "$config" .json)
            if [ "$SELECTED" != all ] && [ "$SELECTED" != "$pkg" ]; then
              continue
            fi
            if latest=$(git describe --tags --abbrev=0 --match "${pkg}@*" 2>/dev/null); then
              count=$(git rev-list "${latest}..HEAD" --count -- "packages/${pkg}")
            else
              latest="the first commit"
              count=$(git rev-list HEAD --count -- "packages/${pkg}")
            fi
            if [ "$count" -eq 0 ]; then
              echo "${pkg}: no commits touching packages/${pkg} since ${latest}; skipping."
            else
              echo "${pkg}: ${count} commits since ${latest}."
              release+=("$pkg")
            fi
          done
          echo "packages=$(jq -cn '$ARGS.positional' --args "${release[@]}")" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.packages != '[]'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: each release pushes to main, and the next one checks
      # out that commit.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm build
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Trusted Publishing uses OIDC; a placeholder NODE_AUTH_TOKEN from
          # setup-node would make npm skip the OIDC exchange.
          NODE_AUTH_TOKEN: ""
          PACKAGE: ${{ matrix.package }}
        run: |
          set +e
          pnpm exec release-it --ci --verbose --config "release-it/${PACKAGE}.json" > /tmp/release-it.log 2>&1
          code=$?
          set -e
          cat /tmp/release-it.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq "There are no commits since the latest tag" /tmp/release-it.log; then
            echo "No releasable ${PACKAGE} commits since its latest tag; skipping."
            exit 0
          fi
          if grep -Fq "main moved during this release" /tmp/release-it.log; then
            echo "main moved before publishing; the run for the newer commit releases it."
            exit 0
          fi
          exit "$code"
