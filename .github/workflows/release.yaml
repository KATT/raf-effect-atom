# Runs after CI passes on a push to main, for the commit CI checked, and
# publishes each package with commits touching its directory since its own
# latest tag. Also runs by hand from the Actions tab, for all packages or one.
name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (each one has its own version and tag)
        type: choice
        default: all
        options:
          - all
          - effect-atom-boundary
          - raf-effect-atom

# One release at a time; a newer run waits, and replaces any run already
# waiting, since it releases everything the older one would have.
concurrency:
  group: ${{ github.workflow }}

jobs:
  # Pick the packages with commits since their own latest tag, so a run with
  # nothing publishable skips install/build.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      sha: ${{ steps.check.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - id: check
        # Tag pattern and path must match git.tagName and git.commitsPath in
        # release-it/<package>.json. Before a package's first tag, every
        # commit under it counts.
        env:
          CHECKED: ${{ github.event.workflow_run.head_sha }}
          SELECTED: ${{ inputs.package || 'all' }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          release=()
          if [ -n "$CHECKED" ] && [ "$CHECKED" != "$sha" ]; then
            echo "main moved past ${CHECKED}, the commit CI checked; the CI run for ${sha} releases it."
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for config in release-it/*.json; do
            pkg=$(basename "$config" .json)
            if [ "$SELECTED" != all ] && [ "$SELECTED" != "$pkg" ]; then
              continue
            fi
            if latest=$(git describe --tags --abbrev=0 --match "${pkg}@*" 2>/dev/null); then
              count=$(git rev-list "${latest}..HEAD" --count -- "packages/${pkg}")
            else
              latest="the first commit"
              count=$(git rev-list HEAD --count -- "packages/${pkg}")
            fi
            if [ "$count" -eq 0 ]; then
              echo "${pkg}: no commits touching packages/${pkg} since ${latest}; skipping."
              continue
            fi
            # Trusted publishing can only be set up on a package that exists,
            # so the first version is published by hand (.github/DEVELOPMENT.md).
            if ! view=$(npm view "$pkg" name 2>&1); then
              if grep -q E404 <<< "$view"; then
                echo "::warning title=${pkg} is not on npm yet::Publish it once by hand and add the trusted publisher (.github/DEVELOPMENT.md, One-time setup). Skipping ${count} commits."
                continue
              fi
              echo "$view"
              exit 1
            fi
            echo "${pkg}: ${count} commits since ${latest}."
            release+=("$pkg")
          done
          echo "packages=$(jq -cn '$ARGS.positional' --args "${release[@]}")" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.packages != '[]'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: each release pushes to main, and the next one checks
      # out that commit.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.packages) }}
    steps:
      # The workflow's own token pushes the release commit and tag, so that
      # push doesn't start CI, and through it this workflow, again.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm build
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          CHECKED: ${{ needs.gate.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          # Trusted Publishing uses OIDC; a placeholder NODE_AUTH_TOKEN from
          # setup-node would make npm skip the OIDC exchange.
          NODE_AUTH_TOKEN: ""
          PACKAGE: ${{ matrix.package }}
        run: |
          # Past the gate's commit, main may only have this run's own release
          # commits. Anything else hasn't passed CI yet; its own run releases it.
          untested=$(git log --format=%s "${CHECKED}..HEAD" | grep -v '^chore(release): ' || true)
          if [ -n "$untested" ]; then
            echo "main has commits CI hasn't checked yet; their CI run releases ${PACKAGE}:"
            echo "$untested"
            exit 0
          fi
          set +e
          pnpm exec release-it --ci --verbose --config "release-it/${PACKAGE}.json" > /tmp/release-it.log 2>&1
          code=$?
          set -e
          cat /tmp/release-it.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq "There are no commits since the latest tag" /tmp/release-it.log; then
            echo "No releasable ${PACKAGE} commits since its latest tag; skipping."
            exit 0
          fi
          if grep -Fq "main moved during this release" /tmp/release-it.log; then
            echo "main moved before publishing; the run for the newer commit releases it."
            exit 0
          fi
          exit "$code"
